name: Deploy website

on:
  push:
    branches:
      - source
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          path: source

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Install dependencies
        working-directory: source
        run: npm ci

      - name: Build
        working-directory: source
        run: npm run build

      - name: Check out deploy branch
        uses: actions/checkout@v4
        with:
          ref: main
          path: deploy

      - name: Update deploy files
        run: |
          rsync -a --delete \
            --exclude .git \
            --exclude .github \
            --exclude CNAME \
            --exclude .nojekyll \
            source/dist/ deploy/
          touch deploy/.nojekyll

      - name: Commit and push deploy
        working-directory: deploy
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No deploy changes."
            exit 0
          fi
          git commit -m "Deploy ${GITHUB_SHA::7}"
          git push origin HEAD:main

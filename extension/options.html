<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Slot Matrix Dock Options</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <main class="shell">
      <header>
        <div>
          <span>Chrome Extension</span>
          <h1>Slot Matrix Dock</h1>
        </div>
        <button id="save">Save config</button>
      </header>

      <section class="panel">
        <div class="section-title">
          <h2>Dock visibility</h2>
          <p>Dock only appears on enabled URLs. Use one URL or pattern per line.</p>
        </div>
        <label class="checkbox-row">
          <input id="dockEnabled" type="checkbox" />
          Enable dock on allowed sites
        </label>
        <label>
          Always show dock on these pages
          <textarea id="dockAllowedSites" spellcheck="false"></textarea>
        </label>
      </section>

      <section class="panel">
        <div class="section-title">
          <h2>Request defaults</h2>
        </div>
        <label>
          Endpoint
          <input id="endpoint" />
        </label>
        <div class="grid">
          <label>
            serviceId
            <input id="serviceId" />
          </label>
          <label>
            userId
            <input id="userId" />
          </label>
          <label>
            currency
            <input id="currency" />
          </label>
        </div>
        <label>
          matrixData
          <textarea id="matrixData"></textarea>
        </label>
        <label>
          tableFormat
          <input id="tableFormat" />
        </label>
        <label>
          powerUpSymbolCode
          <textarea id="powerUpSymbolCode"></textarea>
        </label>
        <label>
          Bearer token / optional
          <input id="bearerToken" />
        </label>
      </section>

      <p id="status">Ready</p>
    </main>
    <script src="options.js"></script>
  </body>
</html>
